<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny Twirl Cloud ☁️ Crochet</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Quicksand',sans-serif}</style>
</head>
<body class="bg-[#fff5f8]">
<!-- Header -->
<header class="text-center py-10">
<img src="profile.jpg" class="w-24 h-24 rounded-full mx-auto border-4 border-pink-200 object-cover">
<h1 class="text-4xl font-bold text-pink-600 mt-4">Tiny Twirl Cloud</h1>
<p class="text-pink-400 mt-2">Handmade with love ☁️✨</p>
</header>

<!-- Patterns Grid -->
<div class="max-w-5xl mx-auto px-6 grid grid-cols-2 md:grid-cols-4 gap-6 pb-20">
<!-- PATTERN 1 -->
<div onclick="openModal('Cloud Stitch ☁️')" class="cursor-pointer bg-white rounded-3xl p-4 shadow-sm hover:shadow-xl hover:-translate-y-1 transition">
<img src="https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=300" class="rounded-2xl w-full h-36 object-cover">
<h3 class="font-bold mt-3 text-gray-700">Cloud Stitch</h3>
<p class="text-xs text-pink-400">Click to view</p>
</div>
<!-- PATTERN 2 -->
<div onclick="openModal('Ribbon Bow 🎀')" class="cursor-pointer bg-white rounded-3xl p-4 shadow-sm hover:shadow-xl hover:-translate-y-1 transition">
<img src="https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=300" class="rounded-2xl w-full h-36 object-cover">
<h3 class="font-bold mt-3 text-gray-700">Ribbon Bow</h3>
<p class="text-xs text-pink-400">Click to view</p>
</div>
<!-- PATTERN 3 -->
<div onclick="openModal('Berry Puff 🍓')" class="cursor-pointer bg-white rounded-3xl p-4 shadow-sm hover:shadow-xl hover:-translate-y-1 transition">
<img src="https://images.unsplash.com/photo-1584992236310-6edddc08acff?w=300" class="rounded-2xl w-full h-36 object-cover">
<h3 class="font-bold mt-3 text-gray-700">Berry Puff</h3>
<p class="text-xs text-pink-400">Click to view</p>
</div>
<!-- PATTERN 4 -->
<div onclick="openModal('Twirl Heart 💖')" class="cursor-pointer bg-white rounded-3xl p-4 shadow-sm hover:shadow-xl hover:-translate-y-1 transition">
<img src="https://images.unsplash.com/photo-1572295727871-d3964104c5da?w=300" class="rounded-2xl w-full h-36 object-cover">
<h3 class="font-bold mt-3 text-gray-700">Twirl Heart</h3>
<p class="text-xs text-pink-400">Click to view</p>
</div>

<!-- TO ADD MORE PATTERNS, COPY BELOW -->

<div onclick="openModal('Your Pattern Name')" class="cursor-pointer bg-white rounded-3xl p-4 shadow-sm hover:shadow-xl hover:-translate-y-1 transition">
<img src="YOUR_IMAGE_LINK" class="rounded-2xl w-full h-36 object-cover">
<h3 class="font-bold mt-3 text-gray-700">Your Pattern Name</h3>
<p class="text-xs text-pink-400">Click to view</p>
</div>
-->

</div>

<!-- Popup Modal -->
<div id="modal" class="fixed inset-0 bg-black/30 backdrop-blur-sm hidden items-center justify-center p-6">
<div class="bg-white rounded-[2rem] p-8 max-w-sm w-full text-center">
<div class="text-5xl mb-4">☁️</div>
<h2 id="modalTitle" class="text-2xl font-bold text-pink-600">Pattern Name</h2>
<p class="text-gray-500 mt-3">This pattern is coming soon! So soft, so twirly — stay tuned 💖</p>
<button onclick="closeModal()" class="mt-6 bg-pink-500 text-white px-8 py-3 rounded-full font-bold">Okay cutie!</button>
</div>
</div>

<script>
function openModal(name){
document.getElementById('modalTitle').innerText=name;
document.getElementById('modal').classList.remove('hidden');
document.getElementById('modal').classList.add('flex');
}
function closeModal(){
document.getElementById('modal').classList.add('hidden');
}
</script>
</body>
</html>
