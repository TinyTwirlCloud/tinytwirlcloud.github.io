<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tiny Twirl Cloud 💖</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
    body{background:#fffcf8;color:#6d3e4a}
    header{position:sticky;top:0;z-index:20;background:#fff8f0f2;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffe0e5}
    .logo{display:flex;align-items:center;gap:6px;font-weight:800;color:#d68a8a;text-decoration:none;font-size:13px}
    .logo img{width:28px;height:28px;border-radius:50%}
    .nav{display:flex;gap:3px}
    .nav button{font-size:9px;font-weight:700;border:none;padding:6px 9px;background:#fff;border-radius:999px;color:#a66;cursor:pointer}
    .nav button.active{background:#ff8fab;color:#fff}
    .hero{margin:12px;background:linear-gradient(135deg,#f3e8ff,#ffe8ec);border-radius:20px;padding:20px;text-align:center}
    .hero-logo{width:85px;height:85px;border-radius:50%;margin:0 auto 10px;display:block;border:3px solid #fff}
    .sbtn{padding:8px 12px;border-radius:999px;font-size:11px;font-weight:700;text-decoration:none;display:inline-block;margin:4px}
    .insta{background:#ff8fab;color:#fff}
    .yt{background:#fff;color:#ff8fab;border:1px solid #ffd6db}
    .sec{display:none;padding-bottom:20px}.sec.show{display:block}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px}
    .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 16px #5a2a3510;position:relative;cursor:pointer}
    .card img{width:100%;height:130px;object-fit:cover}
    .badge{position:absolute;top:6px;left:6px;font-size:8px;font-weight:800;padding:3px 6px;border-radius:999px;background:#fff;color:#ff8fab;border:1px solid #ffd6db}
    .heart{position:absolute;top:6px;right:6px;background:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .card-body{padding:8px 10px}.name{font-size:11px;font-weight:700}
    .aboutBox{margin:12px;background:#fff;border-radius:18px;padding:18px;text-align:center;box-shadow:0 6px 16px #5a2a3510}
    .aboutBox img{width:90px;height:90px;border-radius:50%;border:3px solid #ffd6db;object-fit:cover}
    .founder{margin:12px 10px;background:#fff0f2;border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center}
    .founder img{width:50px;height:50px;border-radius:50%;border:2px solid #fff;object-fit:cover}
    #popup{position:fixed;inset:0;background:#0006;display:none;align-items:end;justify-content:center;z-index:99;padding:10px}
    #popup.show{display:flex}
    .sheet{background:#fff;width:100%;max-width:400px;border-radius:20px;overflow:hidden;position:relative}
    .sheet img{width:100%;height:200px;object-fit:cover}
    .sheet
