*{margin:0;padding:0;box-sizing:border-box}
body{background:#fffcf8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#7a4a4a;text-align:center}
header{padding:9px 12px;background:#fff8f0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px #0001}
.logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:13px;color:#d68a8a;text-decoration:none;cursor:pointer}
.logo img{width:26px;height:26px;border-radius:50%;border:2px solid #ffdae0;object-fit:cover}
.nav{display:flex;gap:5px;align-items:center}
.nav a{font-size:11px;text-decoration:none;color:#b06a6a;font-weight:700;background:#fff;padding:5px 8px;border-radius:12px;box-shadow:0 1px 3px #0001;cursor:pointer}
.pro{font-size:10px;font-weight:800;background:linear-gradient(90deg,#ffd6e7,#ff9ab2);border:none;padding:6px 10px;border-radius:20px;color:#6a2a3a;cursor:pointer}
.hero{margin:12px;background:linear-gradient(135deg,#ffdadf,#ffe8ec);border-radius:24px;padding:28px 16px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 12px #0001;text-align:left;position:relative;cursor:pointer;transition:0.2s}
.card:active{transform:scale(0.97)}
.card img{width:100%;height:165px;object-fit:cover;background:#fff0f2;display:block}
.card-body{padding:9px 11px}
.heart{position:absolute;top:8px;right:8px;background:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0002;font-size:16px;z-index:5;cursor:pointer;user-select:none}
.heart.free-heart{color:#c0a0a0}
.heart.pro-heart{color:#ff4d7a;font-size:18px}
.badge{font-size:9px;font-weight:800;padding:3px 7px;border-radius:8px}
.free{background:#ffe0e5;color:#a04a5a}
.paid{background:#ff8fab;color:#fff}
.title{font-weight:700;font-size:12px;margin-top:5px}
.bio{display:flex;gap:14px;align-items:center;background:#fff0f2;margin:18px 12px;border-radius:22px;padding:18px;text-align:left;border:1px solid #ffdae0;cursor:pointer}
.bio img{width:72px;height:72px;border-radius:50%;border:3px solid #fff;object-fit:cover}
#fav-section{display:none;padding:12px}
#fav-section.show{display:block}
.empty{padding:28px;color:#c08080;font-size:13px}
/* Popup */
#popup{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
#popup.show{display:flex}
.popup-box{background:#fff;border-radius:22px;padding:20px;max-width:320px;width:100%;text-align:left}
.popup-box img{width:100%;border-radius:14px;height:200px;object-fit:cover}
