const patterns=[
{id:'bunny',name:'1. Bunny Amigurumi - PRO',img:'IMG-20260823-WA9459.jpg',emoji:'🐰',isPro:true,coming:false,txt:`BUNNY AMIGURUMI - FULL PATTERN WITH ASSEMBLY

HEAD - Separate:
R1: Magic Ring - 6 Single Crochet (6)
R2: Increase x6 (12)
R3: [SC, INC] x6 (18)
R4: [2 SC, INC] x6 (24)
R5: [3 SC, INC] x6 (30)
R6-R11: SC 30 - 6 rounds (30)
R12: [3 SC, DEC] x6 (24)
R13: [2 SC, DEC] x6 (18) Stuff firmly with polyfill
R14: [SC, DEC] x6 (12)
R15: DEC x6 (6) Close

BODY - Separate:
R1: Magic Ring - 6 SC (6)
R2: INC x6 (12)
R3: [SC, INC] x6 (18)
R4: [2 SC, INC] x6 (24)
R5-R8: SC 24 - 4 rounds (24)
R9: [2 SC, DEC] x6 (18)
R10: SC 18 - Fasten off, leave 20cm tail

EARS x2 - Long Floppy:
Chain 20, R1: SC 19, R2-R15: SC 19 - 14 rows straight

ARMS x2: MR 5 SC, R2 INCx5 (10), R3-R8 SC 10
LEGS x2: MR 6 SC, R2 INCx6 (12), R3-R6 SC 12
Tail: White pompom

ASSEMBLY - IMPORTANT:
1. Stuff Head and Body firmly - No gaps
2. Sew Body to Head: Use long tail from Body, stitch around neck 360 degrees, tight stitches
3. Ears: Fold bottom 1cm, pinch center, sew on top of Head at R4-R5, 6 stitches apart
4. Arms: Sew at side of Body at R6-R7 level, slightly forward
5. Legs: Sew at bottom of Body, 4 SC apart, stuff before closing
6. Tail: Sew white pompom at back center of Body at R3
7. Eyes: Safety eyes at R8-R9, 7 SC apart, embroider nose with pink yarn - small triangle

Cute bunny ready! 🐰`},
{id:'bow',name:'2. Bow Scrunchie - PRO',img:'IMG-20260823-WA5906.jpg',emoji:'🎀',isPro:true,coming:false,txt:`BOW SCRUNCHIE - FULL WITH ASSEMBLY

BAND:
R1: SC 30 around thick black hair band (tight)
R2: Join Pink yarn - 2 Double Crochet in each SC = 60 DC
R3: [DC, INC] repeat = 90 DC - full ruffle

BOW:
Chain 18
R1: SC 17 (17)
R2-R21: SC 17 - 20 rows straight
Fasten off, leave 15cm tail

ASSEMBLY - IMPORTANT:
1. Take Bow rectangle, fold in half
2. Wrap yarn tightly around center 5-6 times to cinch - bow shape banega
3. Keep SL ST seam OUTSIDE - ye design hai, hide mat karo - Important!
4. Position Bow on top of scrunchie band at joint
5. Using tail, sew bow to band: Stitch through center of bow and through 3-4 DC of band, 4-5 times tight
6. Weave all ends inside band
7. Fluff ruffle - 90 DC ko evenly spread karo

Thick fluffy bow ready! 🎀`},
{id:'berry',name:'3. Strawberry Scrunchie - PRO',img:'IMG-20260823-WA8603.jpg',emoji:'🍓',isPro:true,coming:false,txt:`STRAWBERRY SCRUNCHIE - FULL WITH ASSEMBLY

BAND:
R1: SC 30 around thick band
R2: Red yarn - 2 DC in each SC = 60 DC
R3: [DC, INC] repeat = 90 DC ruffle

SEEDS:
White yarn - V stitches: Insert hook randomly, (SL ST, CH1, SL ST) = 1 seed - Make 8-10 seeds evenly on red part

TOP - Green Leaves:
Chain 6 make ring, [Chain 5, Slip Stitch in ring] x5 = 5 small leaves

ASSEMBLY - IMPORTANT:
1. After Band ready (90 DC ruffle), weave red ends
2. Seeds: Use white yarn needle, embroider small V on 8-10 places - Do not pull too tight
3. Leaves: Green top ko band ke ek side pe sew karo - Use tail, stitch base of leaves to 3-4 SC of band
4. Leaves should stand up - thoda starch spray kar sakti ho if needed
5. Arrange ruffle so seeds visible on top

Juicy strawberry ready! 🍓`},
{id:'granny',name:'4. Granny Square - FREE',img:'IMG-20260827-WA4483.jpg',emoji:'🟩',isPro:false,coming:false,txt:`GRANNY SQUARE - FREE WITH ASSEMBLY

PATTERN:
R1: Magic Ring - [three double crochets in one stitch, CH2] x4 = 4 corners (12 DC)
R2: In corners: [3DC, CH2, 3DC] - In side spaces: 3DC
R3: Same - Corners [3DC CH2 3DC], Sides 3DC
R4-R6: Repeat - 10cm size tak

BORDER:
Last Round: Single Crochet all around, corners me 3 SC in CH2 space

ASSEMBLY - FOR BLANKET:
1. Blocking: Square ko 10cm x 10cm pin karo, halka steam spray
2. Joining: For blanket - Lay squares flat, Use white yarn SC join: SC through both squares together
3. Layout: 5 across x 7 down = 35 squares for baby blanket
4. Final Border: After joining all, White yarn se SC all around blanket, corners me 3 SC

Perfect for beginners! FREE!`},
{id:'headband',name:'5. Flower Headband - FREE',img:'IMG-20260823-WA9402.jpg',emoji:'🌼',isPro:false,coming:false,txt:`FLOWER HEADBAND - FREE WITH ASSEMBLY

SIZE:
Adult: Chain 70
Kid: Chain 60
Baby: Chain 50

BASE BAND:
R1: SC in each Chain (70/60/50)
R2-R6: SC 70/60/50 - 5 rows straight - Fasten off, leave tail

FLOWERS x8-12:
Yellow center: Magic Ring 6 SC (6)
White petals: [CH2, DC, CH2, SL ST in next SC] x5 = 5 petals per flower

ASSEMBLY - IMPORTANT:
1. Band ko loop banao - Short ends ko SC se join karo - headband circle banega
2. Flowers placement: Flowers ko band pe evenly place karo - Gap mat chodo - Full cover chahiye as you said!
3. Sewing: Each flower ko 3-4 stitches se band pe sew karo - Yellow center se stitch karo
4. Overlap: Thoda overlap karo flowers ko - plain band na dikhe
5. Weave all ends inside band
6. Test stretch - Flowers tight hone chahiye, girne nahi chahiye

Pretty full flower headband ready! 🌼 FREE!`},
{id:'daisy',name:'6. Daisy Blanket - PRO',img:'IMG-20260827-WA0685.jpg',emoji:'🌼',isPro:true,coming:false,txt:`DAISY BLANKET - FULL WITH ASSEMBLY - 35 SQUARES

DAISY x35:
Yellow center: Magic Ring 6 SC (6)
White petals: [CH2, DC, CH2, SL ST] x12 = 12 petals big daisy

SQUARE x35:
With Pastel color: [3DC, CH2] x4 = 12 DC in Magic Ring
R2: Corners [3DC CH2 3DC], Side spaces 3DC - Square 10cm each
Fasten off each square, leave 10cm tail

ASSEMBLY - IMPORTANT:
1. Blocking: Each 10cm square ko block karo - square shape
2. Layout: Floor pe 5 squares across x 7 down = 35 squares - Arrange colors randomly
3. Daisy Attach: Each square ke center me 1 daisy sew karo - Yellow center se 4 stitches
4. Joining Squares: Use white yarn - SC join method: Hold 2 squares together, SC through both loops
5. First join horizontal rows (5 per row = 7 rows), then join 7 rows vertically
6. Border: After all joined, White yarn se SC all around blanket, corners me 3 SC, 2 rounds
7. Weave all tails - Use needle to hide inside

Size: Baby blanket ~50cm x 70cm - Perfect!
Daisy blanket ready! 🌼`},

let favs=JSON.parse(localStorage.getItem('favs')||'[]');let likes={"bunny":1247,"bow":1189,"berry":1324,"granny":1056,"headband":1128,"daisy":1012,"cat":1045,"tulip":1089,"heartbag":1102,"octo":1034,"chick":1078,"rose":1156,"cherrycoaster":1095,"frog":1099,"sunflower":1120,"bear":1067,"mush":1018,"star":1134,"bowbag":1080,"kitty":1055,"panda":1060,"rainbow":1090,"duck":1048,"heartcoaster":1075,"lily":1039,"bowtie":1085};let liked=JSON.parse(localStorage.getItem('liked')||'{}');let comments=JSON.parse(localStorage.getItem('comms')||'{}');let pro=localStorage.getItem('twirlPro')==='yes';let pending=JSON.parse(localStorage.getItem('pending')||'[]');let approved=JSON.parse(localStorage.getItem('approved')||'[]');let myInstaId=localStorage.getItem('myInstaId')||'';let cur=null;
function render(){let c=document.getElementById('plist');c.innerHTML='';patterns.forEach(p=>{let media=p.coming?`<div class="emoji-box">${p.emoji}</div>`: `<img src="${p.img}">`; c.innerHTML+=`<div class="pattern-card" onclick="openP('${p.id}')"><div class="pro-tag">${p.isPro?'PRO':'FREE'}</div>${p.coming?'<div class="coming-tag">COMING SOON</div>':''}<div class="heart" onclick="event.stopPropagation();toggleFav('${p.id}')">${favs.includes(p.id)?'♥':'♡'}</div>${media}<div style="padding:10px"><b style="font-size:13px">${p.name}</b><p style="font-size:11px;color:#888">${likes[p.id]} likes</p></div></div>`});}
function openP(id){let p=patterns.find(x=>x.id===id);if(p.coming){alert(p.emoji+' Coming Soon!');return;}if(p.isPro&&!pro){alert('PRO Locked! Home > @id > Diya Accept > Code');return;}cur=id;if(p.coming){document.getElementById('dImg').style.display='none';document.getElementById('dEmoji').style.display='flex';document.getElementById('dEmoji').innerText=p.emoji;}else{document.getElementById('dImg').style.display='block';document.getElementById('dEmoji').style.display='none';document.getElementById('dImg').src=p.img;}document.getElementById('dTitle').innerText=p.name;document.getElementById('dLikesTop').innerText=likes[id]+' likes • Assembly inside!';document.getElementById('dText').innerText=p.txt;document.getElementById('dLikeC').innerText=likes[id]+' likes';document.getElementById('dHeart').innerText=liked[id]?'♥':'♡';renderC();document.getElementById('detailPage').classList.add('active');}
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];localStorage.setItem('favs',JSON.stringify(favs));render();}
function toggleH(){if(!cur)return;if(liked[cur]){likes[cur]--;liked[cur]=false;}else{likes[cur]++;liked[cur]=true;}localStorage.setItem('liked',JSON.stringify(liked));document.getElementById('dHeart').innerText=liked[cur]?'♥':'♡';document.getElementById('dLikeC').innerText=likes[cur]+' likes';render();}
function renderC(){let list=document.getElementById('cList');let cm=comments[cur]||[];let h='<div style="font-size:12px;padding:8px 0;border-bottom:1px solid #fff0f3"><b>@crochet_lover</b> Assembly part super helpful! 😍</div>';cm.forEach(c=>{h+=`<div style="font-size:12px;padding:8px 0;border-bottom:1px solid #fff0f3"><b>@you</b> ${c}</div>`});list.innerHTML=h;}
function addC(){let i=document.getElementById('cIn');if(!i.value.trim())return;if(!comments[cur])comments[cur]=[];comments[cur].push(i.value);localStorage.setItem('comms',JSON.stringify(comments));i.value='';renderC();}
function sendReq(){let id=document.getElementById('instaId').value.trim();if(!id.startsWith('@')){alert('Enter @id');return;}myInstaId=id;localStorage.setItem('myInstaId',id);pending.push({id:id,time:new Date().toLocaleString(),approved:false});localStorage.setItem('pending',JSON.stringify(pending));document.getElementById('reqMsg').style.display='block';document.getElementById('reqMsg').innerText='✅ Request sent for '+id+'!';}
function checkPro(){let v=document.getElementById('proInput').value.toUpperCase();let m=document.getElementById('proMsg');if(v!==PRO_CODE){m.style.display='block';m.style.color='red';m.innerText='❌ Wrong code';return;}let currentId=localStorage.getItem('myInstaId')||document.getElementById('instaId').value.trim();if(!approved.includes(currentId)&&approved.length>0){m.style.display='block';m.style.color='#ff8f00';m.innerText='⏳ Diya ne Accept nahi kiya '+currentId;return;}localStorage.setItem('twirlPro','yes');pro=true;m.style.display='block';m.style.color='green';m.innerText='✅ PRO Unlocked!';render();}
function openTab(t){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(t).classList.add('active');document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));let map={home:0,patterns:1,favorite:2,about:3,profile:4};document.querySelectorAll('.nav-item')[map[t]].classList.add('active');}
function showAdmin(){if(document.getElementById('adminPass').value!=='diya123'){alert('Wrong pass');return;}let l=document.getElementById('adminList');let h='';pending.forEach((p,i)=>{h+=`<div style="padding:8px;border:1px solid #ffe6ec;border-radius:8px;margin-bottom:6px;background:${p.approved?'#e8f5e9':'#fff'}"><b>${p.id}</b> - ${p.approved?'✅ APPROVED':'⏳ PENDING'}<br><button onclick="approve(${i})" style="padding:4px 8px;background:#2e7d32;color:#fff;border:none;border-radius:4px;font-size:10px">Accept</button> <button onclick="revoke(${i})" style="padding:4px 8px;background:#ff5a8a;color:#fff;border:none;border-radius:4px;font-size:10px;margin-left:4px">Remove</button></div>`});l.innerHTML=h||'No requests';}
function approve(i){pending[i].approved=true;if(!approved.includes(pending[i].id))approved.push(pending[i].id);localStorage.setItem('pending',JSON.stringify(pending));localStorage.setItem('approved',JSON.stringify(approved));alert('Approved '+pending[i].id);showAdmin();}
function revoke(i){let id=pending[i].id;approved=approved.filter(a=>a!==id);pending[i].approved=false;localStorage.setItem('pending',JSON.stringify(pending));localStorage.setItem('approved',JSON.stringify(approved));localStorage.removeItem('twirlPro');pro=false;alert('Removed '+id);showAdmin();render();}
render();if(myInstaId)document.getElementById('instaId').value=myInstaId;
</script></body></html>
