<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiny Twirl Cloud</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#fffcf8;color:#6d3e4a}
header{position:sticky;top:0;z-index:20;background:#fff8f0ee;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffe0e5}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;color:#d68a8a;text-decoration:none;font-size:13px}
.logo img{width:28px;height:28px;border-radius:50%}
.nav{display:flex;gap:3px}
.nav button{font-size:9px;font-weight:700;border:none;padding:6px 9px;background:#fff;border-radius:999px;color:#a66;cursor:pointer}
.nav button.active{background:#ff8fab;color:#fff}
.hero{margin:12px;background:linear-gradient(135deg,#f3e8ff,#ffe8ec);border-radius:20px;padding:20px;text-align:center}
.hero-logo{width:85px;height:85px;border-radius:50%;margin:0 auto 10px;display:block;border:3px solid #fff}
.sbtn{padding:8px 12px;border-radius:999px;font-size:11px;font-weight:700;text-decoration:none;display:inline-block;margin:4px}
.insta{background:#ff8fab;color:#fff}
.yt{background:#fff;color:#ff8fab;border:1px solid #ffd6db}
.sec{display:none;padding-bottom:20px}.sec.show{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 10px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 16px #5a2a3510;position:relative;cursor:pointer}
.card img{width:100%;height:130px;object-fit:cover}
