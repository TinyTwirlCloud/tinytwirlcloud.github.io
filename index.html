<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny Twirl Cloud ☁️</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Quicksand'; background:#fff5f8; margin:0; padding:20px; text-align:center;}
h1{color:#e94e8a; font-size:36px; margin:10px 0 0;}
.sub{color:#ff8fab; margin-bottom:24px;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:500px; margin:0 auto;}
.card{background:white; border-radius:28px; padding:12px; text-align:left; cursor:pointer; box-shadow:0 4px 15px rgba(0,0,0,0.05);}
.card img{width:100%; height:160px; object-fit:cover; border-radius:20px; background:#ffe3ea;}
.card h3{margin:10px 6px 0; font-size:17px; color:#333;}
.card p{margin:2px 6px 6px; color:#ff8fab; font-size:13px;}
#pop{position:fixed; inset:0; background:rgba(0,0,0,0.25); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:99;}
#pop.show{display:flex;}
.box{background:white; border-radius:28px; padding:28px; width:80%; max-width:320px;}
</style>
</head>
<body>
<h1>Tiny Twirl Cloud</h1>
<div class="sub">Handmade with love ☁️✨</div>

<div class="grid">
<div class="card" onclick="openPop('Watermelon Bunny 🍉')">
<img src="IMG-20260823-WA9459.jpg">
<h3>Watermelon Bunny</h3><p>Click to view</p>
</div>
<div class="card" onclick="openPop('Coquette Bow 🎀')">
<img src="IMG-20260823-WA5906.jpg">
<h3>Coquette Bow</h3><p>Click to view</p>
</div>
<div class="card" onclick="openPop('Lace Headband 💜')">
<img src="IMG-20260823-WA9402.jpg">
<h3>Lace Headband</h3><p>Click to view</p>
</div>
<div class="card" onclick="openPop('Cloudy Daisy ☁️')">
<img src="IMG-20260823-WA3458.jpg">
<h3>Cloudy Daisy</h3><p>Click to view</p>
</div>
</div>

<div id="pop" onclick="closePop()"><div class="box" onclick="event.stopPropagation()">
<div style="font-size:40px;">☁️</div>
<h2 id="popTitle">Pattern</h2>
<p style="color:#777;">Coming soon! So twirly & soft 💖</p>
<button onclick="closePop()" style="background:#ff5a8f; color:white; border:0; padding:10px 24px; border-radius:99px; margin-top:12px;">Okay cutie!</button>
</div></div>

<script>
function openPop(t){document.getElementById('popTitle').innerText=t; document.getElementById('pop').classList.add('show');}
function closePop(){document.getElementById('pop').classList.remove('show');}
</script>
</body>
</html>
