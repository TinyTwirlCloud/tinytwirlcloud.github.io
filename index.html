<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiny Twirl Cloud ☁️</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Quicksand'; background:#fff0f5; margin:0; padding:20px 20px 90px; text-align:center;}
h1{color:#e94e8a; font-size:36px; margin:10px 0 0;}
.sub{color:#ff8fab; background:#ffe3ea; display:inline-block; padding:8px 18px; border-radius:99px; letter-spacing:2px; font-size:12px; font-weight:700; margin-bottom:12px;}
.hero{background:white; border:2px solid #ffe3ea; border-radius:28px; padding:20px; max-width:500px; margin:16px auto;}
.hero img{width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid #ffd6e5;}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; max-width:500px; margin:0 auto;}
.card{background:white; border:2px solid #ffe3ea; border-radius:28px; padding:12px; text-align:left;}
.card img{width:100%; height:160px; object-fit:cover; border-radius:20px;}
.bottom{position:fixed; bottom:12px; left:50%; transform:translateX(-50%); background:white; border:2px solid #ffe3ea; border-radius:99px; display:flex; gap:8px; padding:8px 12px; width:90%; max-width:320px; justify-content:space-around; box-shadow:0 4px 20px rgba(255,143,171,0.3);}
.bottom button{border:0; background:#ffe3ea; color:#e94e8a; padding:10px 20px; border-radius:99px; font-weight:700; font-size:13px;}
.bottom button.active{background:#ff8fab; color:white;}
</style>
</head>
<body>
<h1>Tiny Twirl Cloud</h1>
<div class="sub">• SOFT • PASTEL • BEGINNER FRIENDLY • HANDMADE •</div>
<div style="color:#ff8fab; margin-bottom:20px;">Handmade with love ☁️✨</div>
<div class="hero">
<img src="IMG-20260823-WA0231.jpg">
<h3 style="color:#e94e8a;">Hi, I'm Twirl Girl! 🎀</h3>
<p style="color:#777; font-size:13px;">Soft pastel crochet • beginner friendly 💖</p>
</div>
<div class="grid">
<div class="card"><img src="IMG-20260823-WA9459.jpg"><h3>Watermelon Bunny</h3></div>
<div class="card"><img src="IMG-20260823-WA5906.jpg"><h3>Coquette Bow</h3></div>
<div class="card"><img src="IMG-20260823-WA9402.jpg"><h3>Lace Headband</h3></div>
<div class="card"><img src="IMG-20260823-WA3458.jpg"><h3>Cloudy Daisy</h3></div>
</div>
<div class="bottom">
<button class="active">🏠 Home</button>
<button>💖 Favorites</button>
<button>👤 You</button>
</div>
</body>
</html>
