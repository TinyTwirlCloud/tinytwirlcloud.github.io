<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Twirl Cloud ☁️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fffcf8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#7a4a4a;text-align:center}
header{padding:9px 12px;background:#fff8f0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px #0001}
.logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;color:#d68a8a;text-decoration:none}
.logo img{width:28px;height:28px;border-radius:50%;border:2px solid #ffdae0;object-fit:cover}
.nav{display:flex;gap:6px;align-items:center}
.nav a{font-size:11px;text-decoration:none;color:#b06a6a;font-weight:700;background:#fff;padding:5px 9px;border-radius:12px;box-shadow:0 1px 3px #0001}
.pro{font-size:10px;font-weight:800;background:linear-gradient(90deg,#ffd6e7,#ff9ab2);border:none;padding:6px 11px;border-radius:20px;color:#6a2a3a}
.hero{margin:12px;background:linear-gradient(135deg,#ffdadf,#ffe8ec);border-radius:24px;padding:32px 18px}
.hero h1{font-size:22px}
.hero p{font-size:12px;margin-top:6px;opacity:0.8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 12px #0001;text-align:left;position:relative}
.card img{width:100%;height:175px;object-fit:cover;background:#fff0f2;display:block}
.card-body{padding:10px 12px}
.heart{position:absolute;top:8px;right:8px;background:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #0002;font-size:16px;z-index:2;cursor:pointer;transition:0.2s;user-select:none}
.heart:active{transform:scale(1.3)}
.badge{font-size:9px;font-weight:800;padding:4px 8px;border-radius:8px}
.free{background:#ffe0e5;color:#a04a5a}
.paid{background:#ff8fab;color:#fff}
.title{font-weight:700;font-size:13px;margin-top:6px}
.bio{display:flex;gap:15px;align-items:center;background:#fff0f2;margin:18px 12px;border-radius:22px;padding:18px;text-align:left;border:1px solid #ffdae0}
.bio img{width:80px;height:80px;border-radius:50%;border:3px solid #fff;object-fit:cover;flex-shrink:0}
.bio h3{font-size:15px;margin:0}
.bio p{font-size:12px;margin:7px 0 0;line-height:1.5}
.section-title{font-size:18px;margin:18px 0 4px}
#fav-section{display:none;padding:12px}
#fav-section.show{display:block}
.empty{padding:30px;color:#c08080;font-size:13px}
</style>
</head>
<body>

<header>
<a class="logo" href="#home">
<img src="IMG-20260823-WA2184.jpg" alt="logo"> Tiny Twirl Cloud
</a>
<div class="nav">
<a href="#home">Home</a>
<a href="#pattern">Pattern</a>
<a href="#fav" onclick="showFav(event)">Fav ❤️ <span id="fav-count"></span></a>
<a href="#you">You</a>
<button class="pro">👑 Pro ₹5</button>
</div>
</header>

<div id="home" class="hero">
<h1>Handmade Crochet Patterns 🎀</h1>
<p>Soft pastel • Coquette • Beginner friendly • Made with love</p>

<div class="grid" id="all-patterns">

<div class="card-body"><span class="badge free">FREE</span><div class="title">Watermelon Bunny</div></div>
</div>

<div class="card" data-id="bow">
<span class="heart" onclick="toggleFav(this,'bow')">🤍</span>
<img src="IMG-20260823-WA5906.jpg" alt="Bow">
<div class="card-body"><span class="badge paid">👑 PRO ₹5</span><div class="title">Bow Scrunchie</div></div>
</div>

<div class="card" data-id="headband">
<span class="heart" onclick="toggleFav(this,'headband')">🤍</span>
<img src="IMG-20260823-WA9402.jpg" alt="Headband">
<div class="card-body"><span class="badge free">FREE</span><div class="title">Flower Headband</div></div>
</div>

<div class="card" data-id="daisy">
<span class="heart" onclick="toggleFav(this,'daisy')">🤍</span>
<img src="IMG-20260823-WA3458.jpg" alt="Daisy">
<div class="card-body"><span class="badge paid">👑 PRO ₹5</span><div class="title">Daisy Blanket</div></div>
</div>

</div>
</div>

<h2 class="section-title">Your Favorites ❤️</h2>
