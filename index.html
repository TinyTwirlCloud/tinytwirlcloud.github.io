<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Twirl Cloud ☁️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#fff6f8}
header{position:sticky;top:0;z-index:10;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:2px solid #ffd6de}
.logo{display:flex;align-items:center;gap:6px;font-weight:900;color:#ff6b8a;text-decoration:none;font-size:14px}
.logo span{font-size:22px}
.nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.nav button{border:1.5px solid #ffc9d5;background:#fff;color:#ff6b8a;padding:7px 11px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer}
.nav button.on{background:#ff6b8a;color:#fff}
.page{display:none;padding:10px}.page.on{display:block}
.hero{background:linear-gradient(135deg,#ffe0ec,#e8d8ff);padding:22px;border-radius:22px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.card{background:#fff;border-radius:18px;padding:0;overflow:hidden;box-shadow:0 4px 12px #0001;position:relative;cursor:pointer;text-align:center}
.card-emoji{height:110px;display:grid;place-items:center;font-size:52px;background:#fff0f3}
.card b{display:block;font-size:12px;padding:8px;color:#4a2040}
.heart{position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:50%;background:#fff;border:none;box-shadow:0 2px 6px #0002;font-size:14px;cursor:pointer}
.tag{position:absolute;top:7px;left:7px;background:#fff;color:#ff6b8a;font-size:8px;font-weight:800;padding:3px 7px;border-radius:20px}
.coming{background:#fff;border-radius:18px;margin:12px 0;padding:14px;border:2px dashed #ffb3c3}
.coming h3{text-align:center;color:#ff6b8a;font-size:14px}
.coming-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ffe6ea;font-size:12px}
.coming-item:last-child{border:0}
.about{background:#fff;border-radius:20px;padding:20px;text-align:center;box-shadow:0 4px 12px #0001}
#pop{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
#pop.show{display:flex}
.popbox{background:#fff;width:100%;max-width:360px;border-radius:20px;padding:20px;text-align:center}
</style>
</head><body>

<header>
<a class="logo" href="#" onclick="show('home')"><span>☁️</span> Tiny Twirl<br>Cloud</a>
<div class="nav">
<button id="b-home" class="on" onclick="show('home')">Home</button>
<button id="b-pat" onclick="show('pat')">Patterns</button>
<button id="b-fav" onclick="show('fav')">Fav</button>
<button id="b-about" onclick="show('about')">About</button>
</div>
</header>

<p style="font-size:11px;margin-top:4px">Handmade crochet by Diya Sahai from Gurugram</p>
</div>
<div class="grid" id="homeG"></div>
<div class="coming">
<h3>✨ Coming Soon - 15 Patterns ✨</h3>
<div id="comingList"></div>
</div>
</div>

<div id="pat" class="page">
<h3 style="text-align:center">All Patterns 💖</h3>
<div class="grid" id="patG"></div>
<div class="coming"><h3>🧶 Coming Soon</h3><div id="comingList2"></div></div>
</div>

<div id="fav" class="page">
<h3 style="text-align:center">Your Favorites ❤️</h3>
<div class="grid" id="favG"></div>
<p id="noFav" style="text-align:center;margin-top:30px;font-size:12px;opacity:.6">No fav yet — tap ♡ heart!</p>
</div>
